[tool.black]
line-length = 1024

[tool.ruff]
target-version = "py311"
line-length = 1024
extend-exclude = ["extensions", "webui/node_modules", "webui/dist", "models", "output", "tmp", "cache"]

[tool.ruff.lint]
# Upstream-origin code keeps Forge's legacy rule set (N805, S307, S102, T, W, F). Remi's own code
# (the strict list in per-file-ignores below) also gets the stricter rules: the negated
# per-file-ignores entry switches them off everywhere else. TID251 (banned imports: Gradio) applies
# to the whole tree. tools/check.sh lints the Remi paths, the test suites, the built-in extensions'
# scripts/ and lib_*/, the upstream-origin runtime (modules/, modules_forge/ without the vendored
# packages/, backend/, scripts/, launch.py, webui.py) with the legacy rules, and the rest of the tree
# (vendored third-party code) for syntax errors and banned imports.
select = ["N805", "S307", "S102", "T", "W", "F", "E", "I", "B", "UP", "SIM", "C4", "RUF", "PIE", "PLE", "TID251"]
ignore = [
    "E501", # long lines are the house style (black at 1024)
    "RUF001", "RUF002", "RUF003", # CJK punctuation in strings and comments is intended
    "RUF012", # pydantic models declare mutable defaults safely
    "SIM105", "SIM108", # try/except/pass and if/else blocks are often clearer
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter markers and frozen dataclasses are fine as defaults
extend-immutable-calls = ["fastapi.Query", "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form", "remi.library.GalleryQuery", "remi.prompt_tools.tags.FrequencyConfig"]

[tool.ruff.lint.per-file-ignores]
# Remi's code: remi/, tools/, webui/tools/, docs/, tests/(test_)remi_*.py and every file Remi added to the
# upstream-origin tree (extension params / tests, modules/redact.py, ...). Add new files here.
"!{remi/**,tools/**,webui/tools/**,docs/**,tests/remi_*.py,tests/test_remi_*.py,backend/diffusion_engine/fibo.py,backend/diffusion_engine/flux3.py,backend/nn/anima_attention.py,backend/nn/anima_connector.py,backend/nn/anima_diffusers.py,backend/nn/anima_layout.py,backend/nn/anima_quant.py,backend/nn/anima_qwen35.py,backend/nn/dit_capabilities_ext.py,backend/nn/dit_control_patch.py,backend/nn/dit_registry.py,backend/nn/ernie_diffusers.py,backend/nn/fibo.py,backend/nn/flux3.py,backend/nn/flux3_diffusers.py,backend/nn/flux3_layout.py,backend/nn/krea_diffusers.py,backend/nn/model_capabilities.py,backend/nn/moss_diffusers.py,backend/nn/quant_formats.py,backend/nn/qwen21_diffusers.py,backend/nn/zimage_diffusers.py,backend/patcher/function_chain.py,backend/text_processing/flux3_engine.py,extensions-builtin/*/tests/**,extensions-builtin/anima-lora-stage-scheduler/lib_stage_scheduler/params.py,extensions-builtin/sd-webui-prompt-all-in-one-neo/scripts/prompt_tools.py,extensions-builtin/sd-webui-tagcomplete-neo/scripts/tag_autocomplete.py,extensions-builtin/sd_forge_controlnet/lib_controlnet/openpose.py,extensions-builtin/sd_forge_controlnet/lib_controlnet/region_canvas.py,extensions-builtin/sd_forge_controlnet/lib_controlnet/unit_actions.py,extensions-builtin/sd_forge_controlnet/lib_controlnet/unit_param.py,modules/anima_artifacts.py,modules/anima_feature_conflicts.py,modules/anima_guidance_state.py,modules/anima_lora_files.py,modules/anima_lora_support.py,modules/anima_online_lora.py,modules/anima_presets.py,modules/anima_support.py,modules/anima_user_data.py,modules/extension_route_guard.py,modules/extra_networks_pages.py,modules/forward_override.py,modules/prompt_rewrites.py,modules/redact.py,modules/sd_samplers_anima.py,modules/sd_samplers_anima_cns.py,modules/sd_samplers_anima_freefuse.py,modules/sd_samplers_anima_speed.py,modules/spectrum_force.py,scripts/checkpoint_merger.py,tests/legacy_ui_contract.py,tests/test_dependabot_config.py,tests/test_dependencies.py,tests/test_extra_networks_pages.py,tests/test_processing_negative_conds.py,tests/test_scripts_ported.py,tests/test_scripts_xyz_grid.py,tests/test_settings_file_isolation.py,tests/test_smoke_real_models.py}" = ["E", "I", "B", "UP", "SIM", "C4", "RUF", "PIE", "PLE"]
"{tools/**,webui/tools/**,docs/**,remi/server/launch.py}" = ["T20"] # command-line scripts (also any example or measurement script under docs/) and the launch banner print
"{tests/**,extensions-builtin/*/tests/**}" = ["S102"] # tests exec isolated module sources
# Upstream-origin runtime code and the extensions report to the console with print (startup, install,
# model loading messages): T20 stays on for remi/ and the strict files, which use logging.
"{modules/**,modules_forge/**,backend/**,scripts/**,launch.py,webui.py,extensions-builtin/*/scripts/**,extensions-builtin/*/lib_*/**,extensions-builtin/*/install.py,extensions-builtin/*/joycaption_lib/**}" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The WebUI is Gradio-free (remi/ui params, remi/server REST + WebSocket, webui/ SPA).
"gradio".msg = "Gradio was removed: declare params() with remi.ui and use remi.server routes"
"gradio_client".msg = "Gradio was removed: use the REST API (/api/v2, /sdapi/v1)"
"gradio_rangeslider".msg = "Gradio was removed: use remi.ui.RangeSlider"
# A site-packages "tests" package (ultralytics ships one) shadows the repo's tests/ directory.
"tests".msg = "load tests/ helpers by path (importlib.util.spec_from_file_location), see tests/test_scripts_ported.py"

[tool.ruff.lint.isort]
known-first-party = ["remi", "modules", "modules_forge", "backend"]

[tool.pytest.ini_options]
# Imports resolve from the repo root wherever pytest starts (as modules_forge/initialization.py sets up the bundled packages)
pythonpath = [".", "modules_forge/packages"]
# A leaked resource (an unclosed SQLite connection, file or socket) fails the run: Python hides
# ResourceWarning by default, and one raised while the garbage collector frees an object reaches
# pytest as an "unraisable exception" warning, hence both entries. Set PYTHONTRACEMALLOC=20 to see
# where the leaked object was allocated.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "spa_build: reads the SPA build in webui/dist; tools/check.sh runs these after its own build (step api-docs), not in pytest:tests",
]
