# The non-GPU quality gates of tools/check.sh: a Gradio-free interpreter, lint, the Python suites
# (CPU torch, no models, with the coverage floors of remi/ and of each Remi file outside it),
# the API / settings contracts, i18n coverage, the SPA build and its bundle budget, lint, unit and
# end-to-end tests (mock mode, with axe scans). The real-model smoke test (tools/smoke_real.py) and
# the legacy ui() recorder's self-test (legacy-ui: a second, Gradio, environment) run locally.
name: check

on:
  push:
    branches: [remi]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer push to a pull request replaces its run; a push to remi (or a run by hand) is a group of
  # its own and runs to the end (in one group for the branch, a third push would cancel the
  # second's pending run)
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  python:
    name: Python (Gradio-free env, ruff, pytest + coverage, contracts, i18n)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-dev.txt

      - name: Install the WebUI requirements (CPU torch) and the test tools
        # torch / torchvision: the launcher's versions (modules/launch_utils.py), as CPU builds
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
          # ADetailer's own requirement (the pin of extensions-builtin/ADetailer-Neo/install.py), which
          # tests/test_remi_extensions_e2e.py needs for its tiny detector; torch stays the CPU build
          uv pip install --python .venv/bin/python ultralytics==8.3.253

      - name: Checks
        env:
          PYTHON: .venv/bin/python
          REMI_CHECK_LOGS: ${{ runner.temp }}/remi-check
        run: tools/check.sh --only env,ruff,pytest,contract,i18n:server

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-check-logs
          path: ${{ runner.temp }}/remi-check

  webui:
    name: SPA (build, oxlint, vitest + coverage, Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # the Docker image's Node.js (docker/Dockerfile NODE_VERSION); usage.md also supports 22.18+
          # (launch_utils.NODE_REQUIREMENT), which CI does not run
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        # a version number, never empty or the first words of an error: the cache key would then
        # not name this Playwright's browser
        run: |
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The browser is downloaded once per Playwright version; its system libraries come from apt
      # on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Checks
        working-directory: .
        env:
          CI: "1"
          REMI_CHECK_LOGS: ${{ runner.temp }}/remi-check
        run: tools/check.sh --only pnpm,i18n:spa,perf,e2e

      - name: Logs and Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webui-check-logs
          # the Playwright results are in node_modules/.e2e-results, a hidden folder upload-artifact leaves out
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/remi-check
            webui/node_modules/.e2e-results
            webui/node_modules/.e2e-report
