# Dependency updates for what Remi owns (docs/remi-webui/security.md, "Dependency advisories").
# Dependabot reads this file once it is on the repository's default branch on GitHub.
version: 2
updates:
  # The SPA is Remi's own: all of its packages, in one pull request a week.
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    ignore:
      # ReDoc 3 is another viewer: an ES module (the /redoc page loads a classic script), usage
      # telemetry unless the page opts out, icon sets from cdn.redocly.com and no licence file
      # for what its bundle includes. /redoc stays on ReDoc 2 until the page is ported.
      - dependency-name: redoc
        versions: [">=3.0.0"]
    groups:
      spa:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # The model runtime's pins are Forge Neo's and move with an upstream sync; only the server
  # packages Remi adds to requirements.txt or pins above Forge Neo's are proposed
  # (tests/test_dependabot_config.py). allow and ignore narrow security updates too.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: fastapi
      - dependency-name: python-multipart
      - dependency-name: pytz
      - dependency-name: requests
      - dependency-name: starlette
      - dependency-name: uvicorn
      - dependency-name: websockets
    ignore:
      # FastAPI 0.137 stopped listing included routes in app.routes, which extensions walk
      - dependency-name: fastapi
        versions: [">=0.137.0"]
    groups:
      server:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # The workflow's actions are pinned to commit SHAs (the version in a comment): kept current here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
