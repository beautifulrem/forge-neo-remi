<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- the app's mark (src/app/NavRail.tsx): a sheet of animation paper punched for the peg bar, one stroke on it, on a tile of the dark theme's ground (a tab strip may be light or dark) -->
  <rect width="32" height="32" rx="7" fill="#16181b"/>
  <mask id="holes">
    <rect width="32" height="32" fill="white"/>
    <rect x="6" y="5" width="6" height="3" rx="1.5" fill="black"/>
    <circle cx="16" cy="6.5" r="2" fill="black"/>
    <rect x="20" y="5" width="6" height="3" rx="1.5" fill="black"/>
    <path d="M9 22c3-5 7-7 14-8" fill="none" stroke="black" stroke-width="1.6" stroke-linecap="round"/>
  </mask>
  <g transform="translate(16 16) scale(0.74) translate(-16 -16)">
    <rect x="3" y="2" width="26" height="28" rx="2" fill="#eeece8" mask="url(#holes)"/>
  </g>
</svg>
