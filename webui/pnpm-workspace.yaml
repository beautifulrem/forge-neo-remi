# Install scripts of dependencies never run: @scarf/scarf (pulled in by swagger-ui-dist, the
# vendored /docs viewer) would report the install to scarf.sh. It is not needed: the build copies
# the viewers' prebuilt bundles.
allowBuilds:
  '@scarf/scarf': false

# Resolution hooks (openapi-typescript's TypeScript). Not the default .pnpmfile.cjs: the Docker
# build context leaves out the hidden files of webui/ (.dockerignore), and the build reads none.
pnpmfile: tools/pnpmfile.cjs
